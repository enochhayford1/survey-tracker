<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Beermoney Intel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="brand">📊 Beermoney<br>Intel</div>
      <button class="nav-btn active" data-view="dashboard">🏠 Dashboard</button>
      <button class="nav-btn" data-view="alerts">🔔 Alerts</button>
      <div class="nav-group">Research</div>
      <button class="nav-btn" data-view="opportunities">🎯 Opportunities</button>
      <button class="nav-btn" data-view="questions">❓ Top Questions</button>
      <button class="nav-btn" data-view="sites-rank">🏆 Top Sites</button>
      <button class="nav-btn" data-view="keywords">🔍 Keyword Explorer</button>
      <button class="nav-btn" data-view="painpoints">🧠 Pain Points</button>
      <button class="nav-btn" data-view="competitors">🕵️ Competitors</button>
      <button class="nav-btn" data-view="rising">🚀 Rising &amp; Watchlist</button>
      <button class="nav-btn" data-view="reputation">⚠️ Reputation Monitor</button>
      <div class="nav-group">Content</div>
      <button class="nav-btn" data-view="ideas">💡 Idea Generator</button>
      <button class="nav-btn" data-view="factory">🏭 Draft Factory</button>
      <button class="nav-btn" data-view="briefing">📰 Briefing</button>
      <button class="nav-btn" data-view="calendar">📅 Content Planner</button>
      <div class="nav-group">Business</div>
      <button class="nav-btn" data-view="links">🔗 Affiliate Links</button>
      <button class="nav-btn" data-view="sites-db">🗂 Site Database</button>
      <button class="nav-btn" data-view="revenue">💵 Revenue</button>
      <button class="nav-btn" data-view="ranktracker">📊 Rank Tracker</button>
      <div class="nav-spacer"></div>
      <button class="nav-btn" data-view="settings">⚙ Settings</button>
      <div class="data-status" id="data-status">Loading data…</div>
    </nav>

    <main class="content">
      <div id="demo-banner" class="demo-banner hidden"></div>
      <section id="view-dashboard" class="view"></section>
      <section id="view-alerts" class="view hidden"></section>
      <section id="view-factory" class="view hidden"></section>
      <section id="view-briefing" class="view hidden"></section>
      <section id="view-ranktracker" class="view hidden"></section>
      <section id="view-opportunities" class="view hidden"></section>
      <section id="view-painpoints" class="view hidden"></section>
      <section id="view-competitors" class="view hidden"></section>
      <section id="view-questions" class="view hidden"></section>
      <section id="view-sites-rank" class="view hidden"></section>
      <section id="view-keywords" class="view hidden"></section>
      <section id="view-rising" class="view hidden"></section>
      <section id="view-reputation" class="view hidden"></section>
      <section id="view-ideas" class="view hidden"></section>
      <section id="view-calendar" class="view hidden"></section>
      <section id="view-links" class="view hidden"></section>
      <section id="view-sites-db" class="view hidden"></section>
      <section id="view-revenue" class="view hidden"></section>
      <section id="view-settings" class="view hidden"></section>
    </main>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="renderer.js"></script>
</body>
</html>
